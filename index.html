<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Film-Inventur</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14110f">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--bg:#e9e5da;--c:#f7f4ec;--t:#1b1713;--m:#6e675a;--l:#cfc8b6;--a:#1b1713;--at:#f3b705;--ky:#f3b705;--rb:#b8520a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12100e;--c:#1c1916;--t:#ece5d6;--m:#a39b8a;--l:#35302a;--a:#f3b705;--at:#14110e;--rb:#f08a2b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif}
header{position:sticky;top:0;background:#14110f;color:#ece5d6;z-index:5;padding:8px 12px 0}
header::after{content:"";display:block;height:12px;margin:10px -12px 0;background:radial-gradient(circle at 9px 6px,var(--bg) 3.5px,transparent 4px) 0 0/18px 12px repeat-x}
h1{font:700 21px Georgia,serif;color:var(--ky);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
#ms{font:12px "Courier New",monospace;color:#a39b8a;font-weight:400;margin-left:auto}
nav{display:flex;gap:6px;margin-top:8px}nav button{flex:1;background:transparent;color:#ece5d6;border-color:#4a4338}nav button.on{background:var(--ky);color:#14110f;border-color:var(--ky)}
header #sy{background:transparent;color:var(--ky);border-color:#4a4338;padding:4px 10px}
main{padding:12px 12px 80px;max-width:760px;margin:auto}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button.pr{background:var(--a);color:var(--at);border-color:var(--a)}button.rd{color:#b42318}
.cd{background:var(--c);border:1px solid var(--l);border-left:8px solid var(--l);border-radius:4px 10px 10px 4px;padding:10px 12px;margin:8px 0}
.t0{border-left-color:#e8761e}.t1{border-left-color:#9a968c}.t2{border-left-color:#3a8f87}.fc{border-left-color:var(--ky)}
.r1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.r1 b{font:700 17px Georgia,serif;margin-right:auto}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.ch{font:12px "Courier New",monospace;color:var(--rb);border:1px solid var(--rb);border-radius:3px;padding:1px 6px}
.bar{height:6px;background:var(--l);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.q{display:flex;align-items:center;gap:8px}.q b{min-width:28px;text-align:center;font:700 22px Georgia,serif}.q button{width:38px;height:38px;padding:0;font-size:20px}
small,.m{color:var(--m);font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}.sum small{width:100%}.w{padding:2px 10px;border-radius:20px;font-size:13px;color:#fff}.w.r{background:#c0392b}.w.o{background:#d4701c}
.fl{display:flex;gap:6px;flex-wrap:wrap}.fl select{flex:1;min-width:100px}
.st{font:12px "Courier New",monospace;padding:2px 8px;border-radius:3px;background:var(--l)}.s1{background:#f3b705;color:#14110f}.s2{background:#9fd0c8;color:#14110f}.s3{background:var(--a);color:var(--at)}
.th{width:100%;max-height:90px;object-fit:cover;border-radius:4px;margin-bottom:6px}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.bn{background:#14110f;color:var(--ky);border-radius:8px;padding:10px 12px}.bn b{display:block;font:700 34px/1 Georgia,serif}.bn span{font-size:12px;color:#d8cfbb}
.bl{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:8px 10px}.bl.wd{grid-column:1/-1}.bl h4{margin:0 0 6px;font:700 13px Georgia,serif}
.sb{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin-bottom:4px}.sb i{display:block}.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.lg u{width:9px;height:9px;border-radius:2px;display:inline-block}
dialog{width:min(580px,94vw);max-height:92vh;overflow:auto;border:0;border-radius:12px;background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--m);margin-top:8px}dialog input,dialog select,dialog textarea{width:100%;display:block;margin-top:2px}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tb{display:flex;gap:6px;margin-top:10px}.tb button,.ib{padding:6px 12px;border:1px solid var(--l);border-radius:6px;margin:0;color:var(--t);cursor:pointer}
#nt{min-height:120px;border:1px solid var(--l);border-radius:6px;padding:8px;margin-top:6px}#nt img,.cp{max-width:100%}.cp{border-radius:6px;margin-top:6px}
footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.gh{display:flex;gap:10px;align-items:center}.pi{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font:700 24px Georgia,serif;color:#14110f}.gn{font:700 30px Georgia,serif}.ur{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--l)}.ur span{flex:1;font-size:14px}.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.ck{padding:4px 10px;margin:3px 4px 0 0;font:12px "Courier New",monospace;color:var(--rb);border-color:var(--rb)}.fl{margin-top:6px}.fl input{flex:1;min-width:100px}
.vw table{width:100%;border-collapse:collapse;margin-top:8px}.vw th{text-align:left;font-weight:400;color:var(--m);font-size:13px;padding:5px 8px 5px 0;vertical-align:top;width:42%}.vw td{padding:5px 0}.vw tr{border-bottom:1px dashed var(--l)}.vw .cp{width:100%}.vw h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.nv{border:1px solid var(--l);border-radius:6px;padding:8px}.nv img{max-width:100%}
</style></head><body>
<header><h1>Film-Inventur <span id="ms"></span><button id="sy">⟳ Sync</button></h1><nav><button data-v="inv">Bestand</button><button data-v="sorten">Sorten</button><button data-v="films">Filme</button></nav></header>
<main id="main"></main>
<dialog id="d"></dialog>
<script>
// Build 7 – bei jeder Änderung BUILD hier und V in sw.js erhöhen
const BUILD=7,ALLF=['120 6x6','120 6x4,5','120','135','135w','Instant'],ST=['entnommen','belichtet','entwickelt','gescannt'],TYP=['Farbe','S/W','Instant'];
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),now=()=>Date.now(),today=()=>new Date().toISOString().slice(0,10),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
op=(a,v)=>a.map(o=>`<option value="${esc(o)}" ${o==v?'selected':''}>${esc(o)}</option>`).join('');
let S,view='inv',sk='exp',asc=true,fF='',fT='',fS='',tok,tokExp=0,tm;
const db=new Promise(r=>{const q=indexedDB.open('fi',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result)});
const idbGet=async k=>{const d=await db;return new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result)})};
const idbSet=async(k,v)=>{const d=await db;return new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r})};
function seed(){const L=[['Fuji Velvia 50','120','','Farbe',50,1],['Kodak Ektar 100','120','','Farbe',100,5],['Fujicolor Pro 160S','120','','Farbe',160,4],['Kodak Portra 160','120','','Farbe',160,2],['Fuji Provia 100F','120','','Farbe',100,2],['Kodak Gold 200','135','36','Farbe',200,14],['Kodak Gold 200 (lose, Dose)','135','','Farbe',200,2,'angebrochen/unklar'],['Kodak UltraMax 400','135','24','Farbe',400,10],['Agfa Color 400','135','24','Farbe',400,4],['Wolfen NC500','135','36','Farbe',400,1,'Label ISO 400'],['Fujicolor Superia 200','135','36','Farbe',200,1],['Fuji Superia X-TRA 400 (lose)','135','36','Farbe',400,1,'lose'],['Kentmere Pan 400','120','','S/W',400,8],['Kentmere Pan 400','135','36','S/W',400,1],['Agfa APX 400','135','36','S/W',400,3],['Fomapan Action 400','135','36','S/W',400,2],['Fomapan Action 400','120','','S/W',400,1],['Kodak Tri-X 400','135','36','S/W',400,3],['Kodak T-Max 400','135','36','S/W',400,6],['T-Max 400 (lose, Dose 9/15)','135','','S/W',400,1,'angebrochen/unklar'],['Kodak T-Max 400','120','','S/W',400,13],['Ilford Delta 3200','120','','S/W',3200,1],['Fuji FP-3000B Sofortbild','Instant','','Instant',3000,2]];
return{inv:L.map((a,i)=>({id:'i'+i,brand:a[0],fmt:a[1],len:a[2],type:a[3],iso:a[4],qty:a[5],exp:'',note:a[6]||'',cnt:today(),u:now()})),films:[],cams:[['Olympus OM-1',['135']],['Minox 35 ML',['135']],['Canon EOS-100',['135']],['Zenza Bronica SQ-Ai',['120 6x6','120 6x4,5','135','135w']]].map(c=>({id:'c'+c[0],name:c[0],fm:c[1],u:now()})),lc:today(),lcu:now()}}
const mo=e=>{if(!e)return null;const[y,m]=e.split('-');return(new Date(y,m,0,23,59)-now())/2.63e9};
const fname=f=>{let n=f.name||'';if(f.iso&&!n.includes(f.iso))n+=' '+f.iso;if(f.eiso&&f.eiso!=f.iso)n+='@'+f.eiso;return n};
function ex(r){const m=mo(r.exp);if(m===null)return['#8a877e',100,'Ablauf unbekannt'];const d=r.exp.split('-').reverse().join('/');if(m<0)return['#c0392b',100,`abgelaufen (${d})`];const n=Math.round(m);return[m<3?'#d4701c':m<12?'#e0b400':'#2e8b57',Math.max(6,Math.min(100,m/36*100)),`${d} · noch ${n} Mon.`]}

const ISOS=[12,25,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,3200,6400],isoL=v=>['',...[...new Set([...ISOS,+v].filter(x=>x>0))].sort((a,b)=>a-b)];
const C41=[['3:15','4:00'],['3:30','6:00'],['3:45','10:00'],['4:00','15:00']],BC={kodak:'#f3b705',fuji:'#2e9e5b',fujicolor:'#2e9e5b',kentmere:'#d63384',agfa:'#d0302a',ilford:'#6d6d6d',fomapan:'#2a5db0',wolfen:'#2b2b2b',adox:'#e2231a'};
let open=new Set(),fM='',fE='',fC='',fK='',qq='',qf='',cont='',simg='';
const SET={sk:v=>sk=v,fF:v=>fF=v,fT:v=>fT=v,fM:v=>fM=v,fE:v=>fE=v,fS:v=>fS=v,fC:v=>fC=v,fK:v=>fK=v,qq:v=>qq=v,qf:v=>qf=v};
const sfull=s=>`${s.brand} ${s.name||''}`.trim(),slab=s=>sfull(s)+` · ${s.fmt}${s.len?'/'+s.len:''}`,
pi=s=>s.img?`<img class="pi" src="${s.img}">`:`<div class="pi" style="background:${BC[(s.brand||'').toLowerCase()]||'#8a877e'}">${esc((s.brand||'?')[0])}</div>`,
vals=k=>[...new Set(S.units.filter(u=>!u.del&&u[k]).map(u=>u[k]))].sort().reverse().slice(0,8),
chips=k=>`<div>${vals(k).map(v=>`<button type="button" class="ck" data-k="${k}" data-fill="${v}">${v}</button>`).join('')}</div>`,
fillh=d=>{d.onclick=e=>{const b=e.target.closest('[data-fill]');if(b)d.querySelector(`[name=${b.dataset.k}]`).value=b.dataset.fill}};
function migrate(s){if(!s.sorten){s.sorten=[];s.units=[];(s.inv||[]).filter(r=>!r.del).forEach(r=>{const[b,...n]=r.brand.split(' '),o={id:'s'+r.id,brand:b,name:n.join(' '),iso:r.iso,type:r.type,fmt:r.fmt,len:r.len||'',img:'',note:r.note||'',cnt:r.cnt||'',u:now()};s.sorten.push(o);for(let i=0;i<r.qty;i++)s.units.push({id:o.id+'-'+i,sid:o.id,exp:r.exp||'',bought:'',out:0,u:now()})});delete s.inv}
if(!s.devs)s.devs=[{id:'dev-tmax',name:'T-Max',chem:'S/W',u:0},{id:'dev-adox',name:'Adox',chem:'S/W',u:0},{id:'dev-c41',name:'ADOX C-Tec 41 Kit',chem:'C41',u:0}];return s}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));$('#main').innerHTML=view=='inv'?rInv():view=='sorten'?rSorten():rFilms()}
function stats(T,SO){const n=T.length,cnt=(f,k)=>k.map(x=>[x,T.filter(u=>f(SO.get(u.sid)||{})==x).length]);
const eb={a:0,b:0,c:0,d:0,u:0};T.forEach(u=>{const m=mo(u.exp);eb[m===null?'u':m<0?'a':m<3?'b':m<12?'c':'d']++});
const F=S.films.filter(f=>!f.del),cams={};F.forEach(f=>{if(f.cam)cams[f.cam]=(cams[f.cam]||0)+1});const top=Object.entries(cams).sort((a,b)=>b[1]-a[1]).slice(0,4);
const bar=(a,c)=>`<div class="sb">${a.map((x,i)=>x[1]?`<i style="flex:${x[1]};background:${c[i]}"></i>`:'').join('')}</div><small>${a.map((x,i)=>`<span class="lg"><u style="background:${c[i]}"></u>${x[0]} ${x[1]}</span>`).join('')}</small>`;
return`<section class="stt"><div class="bn"><b>${n}</b><span>Filme im Lager</span></div><div class="bn"><b>${F.length}</b><span>Filme getrackt</span></div>
<div class="bl"><h4>Typ</h4>${bar(cnt(s=>s.type,TYP),['#e8761e','#9a968c','#3a8f87'])}</div><div class="bl"><h4>Format</h4>${bar(cnt(s=>s.fmt,['120','135','Instant']),['#d9a21b','#6c8cc0','#3a8f87'])}</div>
<div class="bl wd"><h4>Haltbarkeit</h4>${bar([['abgelaufen',eb.a],['<3 Mon.',eb.b],['3–12 Mon.',eb.c],['>12 Mon.',eb.d],['ohne Datum',eb.u]],['#c0392b','#d4701c','#e0b400','#2e8b57','#8a877e'])}</div>
<div class="bl wd"><h4>Entwicklungsstand</h4>${bar(ST.map(x=>[x,F.filter(f=>f.st==x).length]),['#9a968c','#f3b705','#9fd0c8','#2e8b57'])}${top.length?`<div style="margin-top:6px">${top.map(c=>`<span class="ch">${esc(c[0])} ${c[1]}</span>`).join(' ')}</div>`:''}</div></section>`}
function rInv(){const T=S.units.filter(u=>!u.del&&!u.out),SO=new Map(S.sorten.filter(x=>!x.del).map(s=>[s.id,s]));
let G=[...SO.values()].map(s=>{const us=T.filter(u=>u.sid==s.id).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'));return{s,us,n:us.length,e:us.find(u=>u.exp)?.exp||''}}).filter(g=>g.n);
let ab=0,so=0;T.forEach(u=>{const m=mo(u.exp);if(m!==null){if(m<0)ab++;else if(m<3)so++}});const brands=[...new Set(G.map(g=>g.s.brand))].sort();
const st=(m,k)=>k=='a'?m!==null&&m<0:k=='b'?m!==null&&m<3:k=='c'?m!==null&&m<12:m===null;
G=G.filter(g=>(!fF||g.s.fmt==fF)&&(!fT||g.s.type==fT)&&(!fM||g.s.brand==fM)&&(!qq||sfull(g.s).toLowerCase().includes(qq.toLowerCase()))&&(!fE||g.us.some(u=>st(mo(u.exp),fE))));
const K={brand:g=>sfull(g.s),fmt:g=>g.s.fmt,type:g=>g.s.type,iso:g=>g.s.iso,exp:g=>g.e||'9999',n:g=>g.n};
G.sort((a,b)=>{const x=K[sk](a),y=K[sk](b),c=typeof x=='number'?x-y:String(x).localeCompare(String(y),'de');return asc?c:-c});
return stats(T,SO)+`<div class="sum"><b>${T.length} Filme</b>${ab?`<span class="w r">${ab} abgelaufen</span>`:''}${so?`<span class="w o">${so} laufen bald ab</span>`:''}<small>Zuletzt gezählt: ${S.lc||'nie'} <button data-a="count">Alles gezählt</button></small></div>
<div class="fl"><input data-f="qq" placeholder="Suche" value="${esc(qq)}"><select data-f="sk">${[['brand','Marke'],['fmt','Format'],['type','Farbe/S-W'],['iso','ISO'],['exp','Ablauf'],['n','Stückzahl']].map(o=>`<option value="${o[0]}" ${o[0]==sk?'selected':''}>Sortiert: ${o[1]}</option>`).join('')}</select><button data-a="asc">${asc?'↑':'↓'}</button></div>
<div class="fl"><select data-f="fF"><option value="">Alle Formate</option>${op(['120','135','Instant'],fF)}</select><select data-f="fT"><option value="">Farbe+S/W</option>${op(TYP,fT)}</select><select data-f="fM"><option value="">Alle Marken</option>${op(brands,fM)}</select><select data-f="fE"><option value="">Jedes Ablaufdatum</option><option value="a" ${fE=='a'?'selected':''}>abgelaufen</option><option value="b" ${fE=='b'?'selected':''}>&lt; 3 Monate</option><option value="c" ${fE=='c'?'selected':''}>&lt; 12 Monate</option><option value="u" ${fE=='u'?'selected':''}>ohne Datum</option></select></div>
${G.map(g=>{const s=g.s,e=ex({exp:g.e}),no=g.us.filter(u=>!u.exp).length;return`<div class="cd t${TYP.indexOf(s.type)}"><div class="gh">${pi(s)}<div style="flex:1"><div class="r1"><b>${esc(sfull(s))}</b><span class="ch">${s.fmt}${s.len?' / '+s.len:''}</span><span class="ch">${s.type}</span><span class="ch">ISO ${s.iso}</span></div><div class="bar"><i style="width:${e[1]}%;background:${e[0]}"></i></div><small>${e[2]}${no&&g.e?` · ${no} ohne Datum`:''} · gezählt ${s.cnt||'–'}</small></div><div class="gn">${g.n}</div></div>
<div class="r2"><button data-a="tog" data-i="${s.id}">${open.has(s.id)?'▴ Filme':'▾ Filme'}</button><button data-a="bulk" data-i="${s.id}">Datum setzen</button><button data-a="cnt" data-i="${s.id}">Zählen</button><button data-a="sedit" data-i="${s.id}">Sorte</button></div>
${open.has(s.id)?g.us.map(u=>{const x=ex(u);return`<div class="ur"><span><i class="dt" style="background:${x[0]}"></i>${x[2]}${u.bought?' · gekauft '+u.bought:' · Kaufdatum fehlt'}</span><button class="pr" data-a="utake" data-i="${u.id}">Entnehmen</button><button data-a="uedit" data-i="${u.id}">✎</button></div>`}).join(''):''}</div>`}).join('')||'<p class="m">Keine Filme gefunden.</p>'}
<footer><button data-a="buy" class="pr">+ Einkauf</button><button data-a="sadd">+ Sorte</button><button data-a="cam">+ Kamera</button><button data-a="cid">Client-ID</button><button data-a="exp">Backup ↓</button><button data-a="imp">Backup ↑</button><small>Build ${BUILD}</small></footer>`}
const nS=id=>S.units.filter(u=>!u.del&&!u.out&&u.sid==id).length,
delS=s=>{s.del=1;s.u=now();S.units.forEach(u=>{if(u.sid==s.id&&!u.del){u.del=1;u.u=now()}});save()};
function rSorten(){const L=S.sorten.filter(x=>!x.del&&(!qq||sfull(x).toLowerCase().includes(qq.toLowerCase()))).sort((a,b)=>slab(a).localeCompare(slab(b),'de'));
