<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Film-Inventur</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14110f">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--bg:#e9e5da;--c:#f7f4ec;--t:#1b1713;--m:#6e675a;--l:#cfc8b6;--a:#1b1713;--at:#f3b705;--ky:#f3b705;--rb:#b8520a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12100e;--c:#1c1916;--t:#ece5d6;--m:#a39b8a;--l:#35302a;--a:#f3b705;--at:#14110e;--rb:#f08a2b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif}
header{position:sticky;top:0;background:#14110f;color:#ece5d6;z-index:5;padding:8px 12px 0}
header::after{content:"";display:block;height:12px;margin:10px -12px 0;background:radial-gradient(circle at 9px 6px,var(--bg) 3.5px,transparent 4px) 0 0/18px 12px repeat-x}
h1{font:700 21px Georgia,serif;color:var(--ky);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
#ms{font:12px "Courier New",monospace;color:#a39b8a;font-weight:400;margin-left:auto}
nav{display:flex;gap:6px;margin-top:8px}nav button{flex:1;background:transparent;color:#ece5d6;border-color:#4a4338}nav button.on{background:var(--ky);color:#14110f;border-color:var(--ky)}
header #sy{background:transparent;color:var(--ky);border-color:#4a4338;padding:4px 10px}
main{padding:12px 12px 80px;max-width:760px;margin:auto}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button.pr{background:var(--a);color:var(--at);border-color:var(--a)}button.rd{color:#b42318}
.cd{background:var(--c);border:1px solid var(--l);border-left:8px solid var(--l);border-radius:4px 10px 10px 4px;padding:10px 12px;margin:8px 0}
.t0{border-left-color:#e8761e}.t1{border-left-color:#9a968c}.t2{border-left-color:#3a8f87}.fc{border-left-color:var(--ky)}
.r1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.r1 b{font:700 17px Georgia,serif;margin-right:auto}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.ch{font:12px "Courier New",monospace;color:var(--rb);border:1px solid var(--rb);border-radius:3px;padding:1px 6px}
.bar{height:6px;background:var(--l);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.q{display:flex;align-items:center;gap:8px}.q b{min-width:28px;text-align:center;font:700 22px Georgia,serif}.q button{width:38px;height:38px;padding:0;font-size:20px}
small,.m{color:var(--m);font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}.sum small{width:100%}.w{padding:2px 10px;border-radius:20px;font-size:13px;color:#fff}.w.r{background:#c0392b}.w.o{background:#d4701c}
.fl{display:flex;gap:6px;flex-wrap:wrap}.fl select{flex:1;min-width:100px}
.st{font:12px "Courier New",monospace;padding:2px 8px;border-radius:3px;background:var(--l)}.s1{background:#f3b705;color:#14110f}.s2{background:#9fd0c8;color:#14110f}.s3{background:var(--a);color:var(--at)}
.th{width:100%;max-height:90px;object-fit:cover;border-radius:4px;margin-bottom:6px}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.bn{background:#14110f;color:var(--ky);border-radius:8px;padding:10px 12px}.bn b{display:block;font:700 34px/1 Georgia,serif}.bn span{font-size:12px;color:#d8cfbb}
.bl{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:8px 10px}.bl.wd{grid-column:1/-1}.bl h4{margin:0 0 6px;font:700 13px Georgia,serif}
.sb{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin-bottom:4px}.sb i{display:block}.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.lg u{width:9px;height:9px;border-radius:2px;display:inline-block}
dialog{width:min(580px,94vw);max-height:92vh;overflow:auto;border:0;border-radius:12px;background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--m);margin-top:8px}dialog input,dialog select,dialog textarea{width:100%;display:block;margin-top:2px}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tb{display:flex;gap:6px;margin-top:10px}.tb button,.ib{padding:6px 12px;border:1px solid var(--l);border-radius:6px;margin:0;color:var(--t);cursor:pointer}
#nt{min-height:120px;border:1px solid var(--l);border-radius:6px;padding:8px;margin-top:6px}#nt img,.cp{max-width:100%}.cp{border-radius:6px;margin-top:6px}
footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
</style></head><body>
<header><h1>Film-Inventur <span id="ms"></span><button id="sy">⟳ Sync</button></h1><nav><button data-v="inv">Bestand</button><button data-v="films">Filme</button></nav></header>
<main id="main"></main>
<dialog id="d"></dialog>
<script>
// Build 2 – bei jeder Änderung BUILD hier und V in sw.js erhöhen
const BUILD=2,ALLF=['120 6x6','120 6x4,5','120','135','135w','Instant'],ST=['entnommen','belichtet','entwickelt','gescannt'],TYP=['Farbe','S/W','Instant'];
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),now=()=>Date.now(),today=()=>new Date().toISOString().slice(0,10),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
op=(a,v)=>a.map(o=>`<option value="${esc(o)}" ${o==v?'selected':''}>${esc(o)}</option>`).join('');
let S,view='inv',sk='exp',asc=true,fF='',fT='',fS='',tok,tokExp=0,tm;
const db=new Promise(r=>{const q=indexedDB.open('fi',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result)});
const idbGet=async k=>{const d=await db;return new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result)})};
const idbSet=async(k,v)=>{const d=await db;return new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r})};
function seed(){const L=[['Fuji Velvia 50','120','','Farbe',50,1],['Kodak Ektar 100','120','','Farbe',100,5],['Fujicolor Pro 160S','120','','Farbe',160,4],['Kodak Portra 160','120','','Farbe',160,2],['Fuji Provia 100F','120','','Farbe',100,2],['Kodak Gold 200','135','36','Farbe',200,14],['Kodak Gold 200 (lose, Dose)','135','','Farbe',200,2,'angebrochen/unklar'],['Kodak UltraMax 400','135','24','Farbe',400,10],['Agfa Color 400','135','24','Farbe',400,4],['Wolfen NC500','135','36','Farbe',400,1,'Label ISO 400'],['Fujicolor Superia 200','135','36','Farbe',200,1],['Fuji Superia X-TRA 400 (lose)','135','36','Farbe',400,1,'lose'],['Kentmere Pan 400','120','','S/W',400,8],['Kentmere Pan 400','135','36','S/W',400,1],['Agfa APX 400','135','36','S/W',400,3],['Fomapan Action 400','135','36','S/W',400,2],['Fomapan Action 400','120','','S/W',400,1],['Kodak Tri-X 400','135','36','S/W',400,3],['Kodak T-Max 400','135','36','S/W',400,6],['T-Max 400 (lose, Dose 9/15)','135','','S/W',400,1,'angebrochen/unklar'],['Kodak T-Max 400','120','','S/W',400,13],['Ilford Delta 3200','120','','S/W',3200,1],['Fuji FP-3000B Sofortbild','Instant','','Instant',3000,2]];
return{inv:L.map(a=>({id:uid(),brand:a[0],fmt:a[1],len:a[2],type:a[3],iso:a[4],qty:a[5],exp:'',note:a[6]||'',cnt:today(),u:now()})),films:[],cams:[['Olympus OM-1',['135']],['Minox 35 ML',['135']],['Canon EOS-100',['135']],['Zenza Bronica SQ-Ai',['120 6x6','120 6x4,5','135','135w']]].map(c=>({id:uid(),name:c[0],fm:c[1],u:now()})),lc:today(),lcu:now()}}
const mo=e=>{if(!e)return null;const[y,m]=e.split('-');return(new Date(y,m,0,23,59)-now())/2.63e9};
const fname=f=>{let n=f.name||'';if(f.iso&&!n.includes(f.iso))n+=' '+f.iso;if(f.eiso&&f.eiso!=f.iso)n+='@'+f.eiso;return n};
function ex(r){const m=mo(r.exp);if(m===null)return['#8a877e',100,'Ablauf unbekannt'];const d=r.exp.split('-').reverse().join('/');if(m<0)return['#c0392b',100,`abgelaufen (${d})`];const n=Math.round(m);return[m<3?'#d4701c':m<12?'#e0b400':'#2e8b57',Math.max(6,Math.min(100,m/36*100)),`${d} · noch ${n} Mon.`]}
function render(){$('nav button.on')?.classList.remove('on');document.querySelector(`nav [data-v=${view}]`).classList.add('on');$('#main').innerHTML=view=='inv'?rInv():rFilms()+''}
function stats(A){const n=A.reduce((s,r)=>s+r.qty,0),by=(f,k)=>k.map(x=>[x,A.filter(r=>f(r)==x).reduce((s,r)=>s+r.qty,0)]);
const eb={a:0,b:0,c:0,d:0,u:0};A.forEach(r=>{const m=mo(r.exp);eb[m===null?'u':m<0?'a':m<3?'b':m<12?'c':'d']+=r.qty});
const F=S.films.filter(f=>!f.del),cams={};F.forEach(f=>{if(f.cam)cams[f.cam]=(cams[f.cam]||0)+1});const top=Object.entries(cams).sort((a,b)=>b[1]-a[1]).slice(0,4);
const bar=(a,c)=>`<div class="sb">${a.map((x,i)=>x[1]?`<i style="flex:${x[1]};background:${c[i]}"></i>`:'').join('')}</div><small>${a.map((x,i)=>`<span class="lg"><u style="background:${c[i]}"></u>${x[0]} ${x[1]}</span>`).join('')}</small>`;
return`<section class="stt"><div class="bn"><b>${n}</b><span>Filme im Lager</span></div><div class="bn"><b>${F.length}</b><span>Filme getrackt</span></div>
<div class="bl"><h4>Typ</h4>${bar(by(r=>r.type,TYP),['#e8761e','#9a968c','#3a8f87'])}</div><div class="bl"><h4>Format</h4>${bar(by(r=>r.fmt,['120','135','Instant']),['#d9a21b','#6c8cc0','#3a8f87'])}</div>
<div class="bl wd"><h4>Haltbarkeit</h4>${bar([['abgelaufen',eb.a],['<3 Mon.',eb.b],['3–12 Mon.',eb.c],['>12 Mon.',eb.d],['ohne Datum',eb.u]],['#c0392b','#d4701c','#e0b400','#2e8b57','#8a877e'])}</div>
<div class="bl wd"><h4>Entwicklungsstand</h4>${bar(ST.map(x=>[x,F.filter(f=>f.st==x).length]),['#9a968c','#f3b705','#9fd0c8','#2e8b57'])}${top.length?`<div style="margin-top:6px">${top.map(c=>`<span class="ch">${esc(c[0])} ${c[1]}</span>`).join(' ')}</div>`:''}</div></section>`}
function rInv(){const A=S.inv.filter(r=>!r.del);let ab=0,so=0;A.forEach(r=>{const m=mo(r.exp);if(m!==null){if(m<0)ab+=r.qty;else if(m<3)so+=r.qty}});
const L=A.filter(r=>(!fF||r.fmt==fF)&&(!fT||r.type==fT));L.sort((a,b)=>{let x=a[sk],y=b[sk];if(sk=='exp'){x=x||'9999';y=y||'9999'}const c=typeof x=='number'?x-y:String(x).localeCompare(String(y),'de');return asc?c:-c});
return stats(A)+`<div class="sum"><b>${A.reduce((s,r)=>s+r.qty,0)} Filme</b>${ab?`<span class="w r">${ab} abgelaufen</span>`:''}${so?`<span class="w o">${so} laufen bald ab</span>`:''}<small>Zuletzt gezählt: ${S.lc||'nie'} <button data-a="count">Alles gezählt</button></small></div>
<div class="fl"><select data-f="sk">${[['brand','Marke'],['fmt','Format'],['type','Farbe/S-W'],['iso','ISO'],['exp','Ablaufdatum'],['qty','Stückzahl']].map(o=>`<option value="${o[0]}" ${o[0]==sk?'selected':''}>Sortiert: ${o[1]}</option>`).join('')}</select><button data-a="asc">${asc?'↑':'↓'}</button><select data-f="fF"><option value="">Alle Formate</option>${op(['120','135','Instant'],fF)}</select><select data-f="fT"><option value="">Farbe+S/W</option>${op(TYP,fT)}</select></div>
${L.map(r=>{const e=ex(r);return`<div class="cd t${TYP.indexOf(r.type)}"><div class="r1"><b>${esc(r.brand)}</b><span class="ch">${r.fmt}${r.len?' / '+r.len:''}</span><span class="ch">${r.type}</span><span class="ch">ISO ${r.iso}</span></div><div class="bar"><i style="width:${e[1]}%;background:${e[0]}"></i></div>
<div class="r2"><small>${e[2]}${r.note?' · '+esc(r.note):''}<br>gezählt ${r.cnt||'–'}</small><span class="q"><button data-a="q-" data-i="${r.id}">−</button><b>${r.qty}</b><button data-a="q+" data-i="${r.id}">+</button></span></div>
<div class="r2"><button data-a="take" data-i="${r.id}" class="pr">Film entnehmen</button><button data-a="edit" data-i="${r.id}">Bearbeiten</button></div></div>`}).join('')}
<footer><button data-a="add">+ Eintrag</button><button data-a="cam">+ Kamera</button><button data-a="cid">Client-ID</button><small>Build ${BUILD}</small></footer>`}
function rFilms(){const L=S.films.filter(f=>!f.del&&(!fS||f.st==fS)).sort((a,b)=>b.no-a.no);
return`<div class="fl"><select data-f="fS"><option value="">Alle Status</option>${op(ST,fS)}</select><button data-a="fadd">+ Film</button></div>`+(L.map(f=>`<div class="cd fc" data-a="fedit" data-i="${f.id}">${f.contact?`<img class="th" src="${f.contact}">`:''}<div class="r1"><b>#${f.no} ${esc(fname(f))}</b><span class="st s${ST.indexOf(f.st)}">${f.st}</span></div><div class="r2"><small>${[f.cam,f.fmt,f.exposed&&'belichtet '+f.exposed,f.place,f.developed&&'entw. '+f.developed,f.chem].filter(Boolean).map(esc).join(' · ')}</small></div></div>`).join('')||'<p class="m">Noch keine Filme. Im Bestand „Film entnehmen“ tippen.</p>')}
function dlg(t,F,v,ok,exh,op2,del){const d=$('#d');d.innerHTML=`<form method="dialog"><h3>${t}</h3>${F.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${op(f.o,v[f.k])}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="2">${esc(v[f.k])}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v[f.k])}">`}</label>`).join('')}${exh||''}<div class="bt"><button>Abbrechen</button>${del?'<button type="button" id="dl" class="rd">Löschen</button>':''}<button type="button" id="sv" class="pr">Speichern</button></div></form>`;
const fm=d.querySelector('form');$('#sv').onclick=async()=>{if(await ok(Object.fromEntries(new FormData(fm)))!==false)d.close()};if(del)$('#dl').onclick=()=>{if(confirm('Wirklich löschen?')){del();d.close()}};op2&&op2(d);d.showModal()}
function openInv(r,isNew){dlg(isNew?'Neuer Eintrag':'Bearbeiten',[{k:'brand',l:'Marke / Film'},{k:'fmt',l:'Format',t:'select',o:['120','135','Instant']},{k:'len',l:'Aufnahmen (z. B. 36)'},{k:'type',l:'Farbe / S/W',t:'select',o:TYP},{k:'iso',l:'ISO',t:'number'},{k:'exp',l:'Ablauf (Monat)',t:'month'},{k:'qty',l:'Stückzahl (Einzelfilme)',t:'number'},{k:'note',l:'Notiz',t:'area'}],r,d=>{Object.assign(r,d,{iso:+d.iso||0,qty:+d.qty||0,cnt:today(),u:now()});if(isNew)S.inv.push(r);save()},'',null,isNew?null:()=>{r.del=1;r.u=now();save()})}
let cont='';
const img=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});
function openFilm(f,isNew){const cams=S.cams.filter(c=>!c.del),cf=n=>(cams.find(c=>c.name==n)||{}).fm||ALLF;cont=f.contact||'';
const F=[{k:'no',l:'Nr. (änderbar)',t:'number'},{k:'name',l:'Film'},{k:'iso',l:'Nenn-ISO',t:'number'},{k:'eiso',l:'Belichtet mit ISO',t:'number'},{k:'cam',l:'Kamera',t:'select',o:['',...cams.map(c=>c.name)]},{k:'fmt',l:'Format',t:'select',o:[...new Set([...cf(f.cam),f.fmt].filter(Boolean))]},{k:'bought',l:'Gekauft',t:'date'},{k:'exposed',l:'Belichtet am',t:'date'},{k:'place',l:'Ort'},{k:'developed',l:'Entwickelt am',t:'date'},{k:'chem',l:'Chemie',t:'select',o:['','C41','S/W']},{k:'dev',l:'Entwickler'},{k:'dt',l:'Entwicklungszeiten'},{k:'fix',l:'Fixierer'},{k:'st',l:'Status',t:'select',o:ST}];
const exh=`<label>Kontaktabzug (JPG)<input type="file" id="cf" accept="image/*"></label><img id="cp" class="cp" src="${cont}" ${cont?'':'hidden'}><div class="tb"><button type="button" data-c="bold"><b>B</b></button><button type="button" data-c="italic"><i>I</i></button><button type="button" data-c="underline"><u>U</u></button><button type="button" data-c="insertUnorderedList">•</button><button type="button" data-c="hl">🖍</button><label class="ib">📷<input type="file" id="ni" accept="image/*" multiple hidden></label></div><div id="nt" contenteditable>${f.notes||''}</div>`;
dlg(isNew?'Neuer Film':'Film #'+f.no,F,f,d=>{if(S.films.some(x=>!x.del&&x.id!=f.id&&x.no==+d.no)&&!confirm('Nummer '+d.no+' existiert schon. Trotzdem speichern?'))return false;Object.assign(f,d,{no:+d.no,iso:+d.iso||'',eiso:+d.eiso||'',notes:$('#nt').innerHTML,contact:cont,u:now()});if(isNew)S.films.push(f);save()},exh,d=>{
d.querySelectorAll('.tb [data-c]').forEach(b=>{b.onmousedown=e=>{e.preventDefault();const c=b.dataset.c;if(c=='hl'){document.execCommand('hiliteColor',false,'#fde047');document.execCommand('foreColor',false,'#111')}else document.execCommand(c)}});
$('#cf').onchange=async e=>{cont=await img(e.target.files[0]);$('#cp').src=cont;$('#cp').hidden=false};
$('#ni').onchange=async e=>{$('#nt').focus();for(const x of e.target.files)document.execCommand('insertImage',false,await img(x))};
d.querySelector('[name=cam]').onchange=e=>{d.querySelector('[name=fmt]').innerHTML=op(cf(e.target.value),'')}},isNew?null:()=>{f.del=1;f.u=now();save()})}
function take(r){if(r.qty<1)return alert('Bestand ist 0.');r.qty--;r.cnt=today();r.u=now();const no=Math.max(0,...S.films.map(f=>f.no||0))+1;openFilm({id:uid(),no,inv:r.id,name:r.brand.replace(/\s*\(.*\)/,''),iso:r.iso,eiso:'',cam:'',fmt:r.fmt,st:'entnommen',bought:'',exposed:'',place:'',developed:'',chem:r.type=='Farbe'?'C41':r.type=='S/W'?'S/W':'',dev:'',dt:'',fix:'',notes:'',contact:''},true);save()}
$('#main').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,r=S.inv.find(x=>x.id==b.dataset.i);
if(a=='q+'||a=='q-'){r.qty=Math.max(0,r.qty+(a=='q+'?1:-1));r.cnt=today();r.u=now();save()}
else if(a=='take')take(r);else if(a=='edit')openInv(r);
else if(a=='add')openInv({id:uid(),brand:'',fmt:'135',len:'36',type:'Farbe',iso:400,qty:1,exp:'',note:''},true);
else if(a=='asc'){asc=!asc;render()}
else if(a=='count'){S.lc=today();S.lcu=now();S.inv.forEach(x=>{if(!x.del){x.cnt=today();x.u=now()}});save()}
else if(a=='fedit')openFilm(S.films.find(x=>x.id==b.dataset.i));
else if(a=='fadd')openFilm({id:uid(),no:Math.max(0,...S.films.map(f=>f.no||0))+1,name:'',iso:'',eiso:'',cam:'',fmt:'135',st:'entnommen',chem:'',notes:'',contact:''},true);
else if(a=='cam'){const n=prompt('Kameraname:');if(n){S.cams.push({id:uid(),name:n,fm:(prompt('Formate, mit Komma getrennt (Auswahl: '+ALLF.join(' | ')+')','135')||'135').split(',').map(s=>s.trim()),u:now()});save()}}
else if(a=='cid'){localStorage.cid=prompt('Google OAuth Client-ID:',localStorage.cid||'')||''}};
$('#main').onchange=e=>{const k=e.target.dataset.f;if(!k)return;({sk:v=>sk=v,fF:v=>fF=v,fT:v=>fT=v,fS:v=>fS=v})[k](e.target.value);render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
async function save(){await idbSet('s',S);render();clearTimeout(tm);if(tok&&tokExp>now())tm=setTimeout(sync,3000)}
const setMsg=t=>$('#ms').textContent=t;
const cid=()=>localStorage.cid||(localStorage.cid=prompt('Google OAuth Client-ID (dieselbe wie bei der Aufgabenverwaltung):')||'');
const gtoken=()=>new Promise((ok,no)=>{if(tok&&tokExp>now())return ok(tok);if(!window.google)return no('Google-Skript nicht geladen');const c=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:'https://www.googleapis.com/auth/drive.appdata',login_hint:'andi.2019.x@gmail.com',callback:r=>{if(r.access_token){tok=r.access_token;tokExp=now()+r.expires_in*1000-60000;ok(tok)}else no(r.error||'abgebrochen')}});c.requestAccessToken()});
const mg=(a,b)=>{const m=new Map();[...a,...b].forEach(r=>{const o=m.get(r.id);if(!o||(r.u||0)>(o.u||0))m.set(r.id,r)});return[...m.values()]};
const J=async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r};
async function sync(){try{setMsg('Sync…');const h={Authorization:'Bearer '+await gtoken()},G='https://www.googleapis.com/';
const l=await(await J(await fetch(G+"drive/v3/files?spaces=appDataFolder&q=name%3D'film-inventur.json'&fields=files(id)",{headers:h}))).json(),id=l.files?.[0]?.id;
if(id){const d=await(await J(await fetch(G+`drive/v3/files/${id}?alt=media`,{headers:h}))).json();S.inv=mg(S.inv,d.inv||[]);S.films=mg(S.films,d.films||[]);S.cams=mg(S.cams,d.cams||[]);if((d.lcu||0)>(S.lcu||0)){S.lc=d.lc;S.lcu=d.lcu}}
const body=JSON.stringify(S);
if(id)await J(await fetch(G+`upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{...h,'Content-Type':'application/json'},body}));
else{const b='fi'+uid();await J(await fetch(G+'upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{...h,'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n{"name":"film-inventur.json","parents":["appDataFolder"]}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`}))}
await idbSet('s',S);render();setMsg('Sync '+new Date().toLocaleTimeString('de').slice(0,5))}catch(e){setMsg('Sync-Fehler: '+(e.message||e))}}
$('#sy').onclick=sync;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{S=await idbGet('s')||seed();await idbSet('s',S);render()})();
</script></body></html>
